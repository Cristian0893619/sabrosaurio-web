<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Sabrosaurio</title>
    <style>
        /* ESTILOS ORIGINALES */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #006847; /* Verde México */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 4px solid #CE1126; /* Rojo México */
            position: relative;
            z-index: 10; /* Para que quede debajo de la animación si es necesario */
        }
        h1 { margin-bottom: 20px; color: #CE1126; }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #006847;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #CE1126; }
        .error { color: red; display: none; margin-top: 10px; font-weight: bold; }

        /* --- ESTILOS DE LA ANIMACIÓN (NUEVO) --- */
        .taco-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #006847; 
            z-index: 99999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .taco-overlay.active { opacity: 1; pointer-events: all; }
        
        .el-taco-giratorio {
            font-size: 6rem; 
            animation: girarTaco 3s linear infinite; 
            transition: transform 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045); 
            transform: scale(0);
        }
        
        .taco-overlay.active .el-taco-giratorio { transform: scale(1); }
        .taco-overlay.bye-bye .el-taco-giratorio { transform: scale(0) rotate(720deg); transition: transform 0.5s ease-in; }
        
        .texto-cargando { color: white; margin-top: 20px; font-weight: bold; font-size: 1.5rem; animation: parpadeo 1s infinite; font-family: sans-serif; }

        @keyframes girarTaco { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="taco-overlay" id="pantalla-taco-global">

        <div class="texto-cargando">Verificando...</div>
    </div>

    <div class="login-card">

        <p>Introduce la contraseña maestra</p>
        
        <form id="loginForm">
            <input type="password" id="password" placeholder="Contraseña..." required>
            <button type="submit">Entrar</button>
            <p class="error" id="msgError">¡Contraseña incorrecta!</p>
        </form>
        
        <br>
        <a href="sabrosaurio.html" style="color:#666; text-decoration:none;">← Volver al sitio</a>
    </div>
